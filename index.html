<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <div id="balance-display">Total: $0.00</div>
    </header>

    <main>
      <section id="form-section">
        <form id="expense-form" novalidate>
          <div>
            <label for="item-name">Item Name</label>
            <input
              id="item-name"
              type="text"
              placeholder="e.g. Lunch"
              autocomplete="off"
            />
          </div>
          <div>
            <label for="item-amount">Amount ($)</label>
            <input
              id="item-amount"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="0.00"
            />
          </div>
          <div>
            <label for="item-category">Category</label>
            <select id="item-category">
              <option value="">-- Select category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>
          <button type="submit">Add Expense</button>
        </form>
        <div id="form-errors" aria-live="polite"></div>
      </section>

      <section id="list-section">
        <ul id="transaction-list"></ul>
      </section>

      <section id="chart-section">
        <canvas id="spending-chart"></canvas>
      </section>
    </main>

    <div id="storage-warning" hidden>
      Storage is unavailable. Your data will not be saved between sessions.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
